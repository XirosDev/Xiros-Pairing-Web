<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐗ɪʀᴏs 𝐌ᴅ | Session Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #0d0d0d;
            --panel-bg: #1a1a1a;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            width: 90%;
            max-width: 450px;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--dark-bg);
            border: 1px solid var(--border-color);
            color: var(--neon-green);
            font-family: inherit;
            font-size: 1.1rem;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 5px rgba(0, 255, 65, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--neon-green);
            color: var(--dark-bg);
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #00cc33;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        #result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: var(--dark-bg);
            border: 1px dashed var(--neon-green);
            border-radius: 6px;
            display: none;
        }

        #pairing-code {
            font-size: 2rem;
            letter-spacing: 4px;
            margin: 1rem 0;
            color: white;
            font-weight: bold;
        }

        .loader {
            display: none;
            margin: 1rem auto;
            border: 3px solid #333;
            border-top: 3px solid var(--neon-green);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">𝐗ɪʀᴏs 𝐌ᴅ</div>
        <div class="subtitle">Session Generator / Pairing Code</div>

        <div class="input-group">
            <label for="phone">Numéro WhatsApp (avec indicatif) :</label>
            <input type="text" id="phone" placeholder="Ex: 22890000000" autocomplete="off">
        </div>

        <button id="generate-btn" onclick="requestPairingCode()">Générer le Code</button>
        <div class="loader" id="loader"></div>

        <div id="result-box">
            <p>Ton code d'association :</p>
            <div id="pairing-code">----</div>
            <p style="font-size: 0.8rem; color: #888;">Va sur WhatsApp > Appareils connectés > Lier avec le numéro de téléphone</p>
        </div>

        <div class="footer">
            Propulsé par B-Max | © 2026 𝐗ɪʀᴏs
        </div>
    </div>

    <script>
        async function requestPairingCode() {
            const phoneInput = document.getElementById('phone').value;
            const btn = document.getElementById('generate-btn');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('result-box');
            const codeDisplay = document.getElementById('pairing-code');

            if (!phoneInput) {
                alert("Veuillez entrer un numéro de téléphone valide.");
                return;
            }

            btn.disabled = true;
            btn.style.display = 'none';
            loader.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const response = await fetch('/api/get-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: phoneInput })
                });

                const data = await response.json();

                if (data.success) {
                    codeDisplay.textContent = data.code;
                    resultBox.style.display = 'block';
                } else {
                    alert("Erreur: " + data.error);
                    btn.style.display = 'block';
                }
            } catch (err) {
                alert("Impossible de joindre le serveur.");
                btn.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
  </html>
